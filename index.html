<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>React Lifecycle & Analytics Dashboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
            }
          }
        }
      }
    }
  </script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone untuk JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #475569;
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo, useCallback } = React;

    // --- Sub-Component: Lifecycle Log Console ---
    function LifecycleConsole({ logs, onClear }) {
      const logContainerRef = useRef(null);

      // Component Updating Lifecycle Demo
      useEffect(() => {
        if (logContainerRef.current) {
          logContainerRef.current.scrollTop = logContainerRef.current.scrollHeight;
        }
      }, [logs]);

      return (
        <div class="bg-slate-900 text-slate-200 rounded-xl p-4 shadow-lg border border-slate-800 flex flex-col h-64">
          <div class="flex items-center justify-between pb-3 mb-3 border-b border-slate-800">
            <div class="flex items-center space-x-2">
              <span class="w-3 h-3 rounded-full bg-red-500 inline-block"></span>
              <span class="w-3 h-3 rounded-full bg-yellow-500 inline-block"></span>
              <span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span>
              <h3 class="text-xs font-mono font-semibold ml-2 text-slate-400 uppercase tracking-wider">React Lifecycle Logger</h3>
            </div>
            <button 
              onClick={onClear}
              class="text-xs text-slate-400 hover:text-white bg-slate-800 hover:bg-slate-700 px-2.5 py-1 rounded transition">
              Clear Console
            </button>
          </div>
          <div ref={logContainerRef} class="font-mono text-xs overflow-y-auto space-y-1.5 custom-scrollbar flex-1 pr-2">
            {logs.length === 0 ? (
              <span class="text-slate-600 italic">Menunggu event lifecycle...</span>
            ) : (
              logs.map((log) => (
                <div key={log.id} class="flex items-start space-x-2 animate-fadeIn">
                  <span class="text-slate-500 shrink-0">[{log.timestamp}]</span>
                  <span class={`font-semibold shrink-0 ${log.typeColor}`}>{log.type}</span>
                  <span class="text-slate-300 break-all">{log.message}</span>
                </div>
              ))
            )}
          </div>
        </div>
      );
    }

    // --- Sub-Component: Live Clock Widget (Mounting/Unmounting Lifecycle Demo) ---
    function LiveClockWidget({ addLog }) {
      const [time, setTime] = useState(new Date().toLocaleTimeString());
      const [ticks, setTicks] = useState(0);

      useEffect(() => {
        // Lifecycle: MOUNTING
        addLog('MOUNT', 'LiveClockWidget berhasil di-mount ke DOM', 'text-emerald-400');
        
        const timerId = setInterval(() => {
          setTime(new Date().toLocaleTimeString());
          setTicks((prev) => prev + 1);
        }, 1000);

        // Lifecycle: UNMOUNTING (Cleanup)
        return () => {
          clearInterval(timerId);
          addLog('UNMOUNT', 'LiveClockWidget dibersihkan (Interval cleared)', 'text-rose-400');
        };
      }, []);

      return (
        <div class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-between">
          <div>
            <p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Realtime Timer Widget</p>
            <h4 class="text-2xl font-bold mt-1 font-mono text-brand-600 dark:text-brand-500">{time}</h4>
            <p class="text-xs text-slate-400 mt-1">Tick Count: <span class="font-bold text-slate-600 dark:text-slate-300">{ticks}</span></p>
          </div>
          <div class="w-12 h-12 rounded-full bg-brand-50 dark:bg-slate-700 flex items-center justify-center text-brand-600 dark:text-brand-500 text-xl">
            <i class="fa-regular fa-clock animate-pulse"></i>
          </div>
        </div>
      );
    }

    // --- Sub-Component: User Modal (Child Mount/Unmount Demo) ---
    function UserModal({ isOpen, onClose, onAddUser, addLog }) {
      const [name, setName] = useState('');
      const [role, setRole] = useState('Developer');

      useEffect(() => {
        if (isOpen) {
          addLog('MOUNT', 'Modal Component dibuka', 'text-cyan-400');
        }
        return () => {
          if (isOpen) {
            addLog('UNMOUNT', 'Modal Component ditutup & dibersihkan', 'text-amber-400');
          }
        };
      }, [isOpen]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!name.trim()) return;
        onAddUser({ name, role, status: 'Active' });
        setName('');
        onClose();
      };

      return (
        <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
          <div class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl w-full max-w-md border border-slate-200 dark:border-slate-700 overflow-hidden animate-scaleUp">
            <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-700 flex justify-between items-center">
              <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100">Tambah Pengguna Baru</h3>
              <button onClick={onClose} class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                <i class="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>
            <form onSubmit={handleSubmit} class="p-6 space-y-4">
              <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Nama Lengkap</label>
                <input 
                  type="text" 
                  required
                  value={name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="Masukkan nama"
                  class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500"
                />
              </div>
              <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Peran / Jabatan</label>
                <select 
                  value={role}
                  onChange={(e) => setRole(e.target.value)}
                  class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg bg-white dark:bg-slate-900 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-brand-500"
                >
                  <option value="Developer">Developer</option>
                  <option value="Designer">Designer</option>
                  <option value="Product Manager">Product Manager</option>
                  <option value="QA Engineer">QA Engineer</option>
                </select>
              </div>
              <div class="flex justify-end space-x-3 pt-4">
                <button 
                  type="button"
                  onClick={onClose}
                  class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition">
                  Batal
                </button>
                <button 
                  type="submit"
                  class="px-4 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 rounded-lg shadow transition">
                  Simpan Data
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- Main Application Component --- 
    function App() {
      const [darkMode, setDarkMode] = useState(false);
      const [showWidget, setShowWidget] = useState(true);
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [logs, setLogs] = useState([]);
      
      const [users, setUsers] = useState([
        { id: 1, name: 'Budi Santoso', role: 'Developer', status: 'Active' },
        { id: 2, name: 'Siti Rahma', role: 'Designer', status: 'Active' },
        { id: 3, name: 'Ahmad Dahlan', role: 'Product Manager', status: 'Inactive' },
      ]);

      // Helper Function untuk Logging Lifecycle
      const addLog = useCallback((type, message, typeColor = 'text-blue-400') => {
        const now = new Date();
        const timestamp = now.toTimeString().split(' ')[0] + '.' + String(now.getMilliseconds()).padStart(3, '0');
        setLogs((prevLogs) => [
          ...prevLogs,
          { id: Date.now() + Math.random(), timestamp, type, message, typeColor }
        ]);
      }, []);

      // 1. Initial Mount Lifecycle
      useEffect(() => {
        addLog('MOUNT', 'App Root berhasil di-render (Initial Component Mount)', 'text-emerald-400');
      }, [addLog]);

      // 2. Theme Lifecycle Update
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          addLog('UPDATE', 'Tema diubah menjadi Dark Mode', 'text-purple-400');
        } else {
          document.documentElement.classList.remove('dark');
          addLog('UPDATE', 'Tema diubah menjadi Light Mode', 'text-purple-400');
        }
      }, [darkMode, addLog]);

      // 3. User State Change Lifecycle
      useEffect(() => {
        addLog('UPDATE', `Daftar Pengguna diperbarui (Total: ${users.length} pengguna)`, 'text-amber-400');
      }, [users, addLog]);

      // Derived State dengan useMemo
      const filteredUsers = useMemo(() => {
        return users.filter(u => 
          u.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
          u.role.toLowerCase().includes(searchQuery.toLowerCase())
        );
      }, [users, searchQuery]);

      const handleAddUser = (newUser) => {
        setUsers((prev) => [...prev, { ...newUser, id: Date.now() }]);
      };

      const handleDeleteUser = (id) => {
        setUsers((prev) => prev.filter(u => u.id !== id));
      };

      return (
        <div class="min-h-screen flex flex-col">
          {/* Top Header Navbar */}
          <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-40">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
              <div class="flex items-center space-x-3">
                <div class="bg-brand-600 text-white p-2 rounded-lg">
                  <i class="fa-solid fa-cubes text-xl"></i>
                </div>
                <div>
                  <h1 class="font-bold text-lg leading-tight text-slate-800 dark:text-slate-100">React Architecture</h1>
                  <p class="text-xs text-slate-500 dark:text-slate-400">Lifecycle Hooks & Interactive Dashboard</p>
                </div>
              </div>

              <div class="flex items-center space-x-3">
                {/* Toggle Dark Mode Button */}
                <button 
                  onClick={() => setDarkMode(!darkMode)}
                  class="p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition">
                  <i class={`fa-solid ${darkMode ? 'fa-sun text-amber-400' : 'fa-moon'}`}></i>
                </button>
                
                <button 
                  onClick={() => setIsModalOpen(true)}
                  class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-2 rounded-lg shadow flex items-center space-x-2 transition">
                  <i class="fa-solid fa-plus"></i>
                  <span>Tambah User</span>
                </button>
              </div>
            </div>
          </header>

          {/* Main Content Area */}
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
            
            {/* Top Row Grid */}
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
              {/* Widget Toggle Card */}
              <div class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex flex-col justify-between">
                <div>
                  <span class="text-xs font-semibold uppercase tracking-wider text-brand-600 dark:text-brand-400">Control Panel</span>
                  <h3 class="text-lg font-bold mt-1">Lifecycle Unmount Test</h3>
                  <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
                    Gunakan tombol di bawah untuk menyalakan/mematikan widget clock & memicu cleanup lifecycle.
                  </p>
                </div>
                <button 
                  onClick={() => setShowWidget(!showWidget)}
                  class={`mt-4 w-full py-2 px-4 rounded-lg text-sm font-semibold transition border ${showWidget ? 'bg-rose-50 text-rose-600 border-rose-200 hover:bg-rose-100 dark:bg-rose-950/30 dark:border-rose-900' : 'bg-emerald-50 text-emerald-600 border-emerald-200 hover:bg-emerald-100 dark:bg-emerald-950/30 dark:border-emerald-900'}`}>
                  {showWidget ? 'Unmount Widget Clock' : 'Mount Widget Clock'}
                </button>
              </div>

              {/* Dynamic Live Widget */}
              {showWidget ? (
                <LiveClockWidget addLog={addLog} />
              ) : (
                <div class="bg-slate-100 dark:bg-slate-800/50 border-2 border-dashed border-slate-300 dark:border-slate-700 rounded-xl p-5 flex flex-col items-center justify-center text-center">
                  <i class="fa-solid fa-plug-circle-xmark text-3xl text-slate-400 mb-2"></i>
                  <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Widget Unmounted</p>
                  <p class="text-xs text-slate-400">Komponen telah dihapus dari DOM tree.</p>
                </div>
              )}

              {/* Summary Stats */}
              <div class="bg-white dark:bg-slate-800 p-5 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                <div>
                  <p class="text-xs font-medium text-slate-500 dark:text-slate-400 uppercase tracking-wider">Total Tim Aktif</p>
                  <h4 class="text-3xl font-bold mt-1 text-slate-800 dark:text-slate-100">{users.length} <span class="text-sm font-normal text-slate-400">Anggota</span></h4>
                  <p class="text-xs text-emerald-500 mt-1 flex items-center">
                    <i class="fa-solid fa-arrow-trend-up mr-1"></i> Updated via React State
                  </p>
                </div>
                <div class="w-12 h-12 rounded-full bg-emerald-50 dark:bg-slate-700 flex items-center justify-center text-emerald-600 dark:text-emerald-400 text-xl">
                  <i class="fa-solid fa-users"></i>
                </div>
              </div>
            </div>

            {/* Real-time Console Log Area */}
            <LifecycleConsole logs={logs} onClear={() => setLogs([])} />

            {/* Interactive Table Section */}
            <div class="bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden">
              <div class="p-5 border-b border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                <div>
                  <h2 class="text-base font-bold text-slate-800 dark:text-slate-100">Daftar Anggota Tim</h2>
                  <p class="text-xs text-slate-500 dark:text-slate-400">Manajemen data dengan re-render state teroptimasi.</p>
                </div>
                <div class="relative w-full sm:w-64">
                  <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                  <input 
                    type="text"
                    placeholder="Cari nama/peran..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    class="w-full pl-9 pr-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg bg-slate-50 dark:bg-slate-900 focus:outline-none focus:ring-2 focus:ring-brand-500"
                  />
                </div>
              </div>

              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                  <thead>
                    <tr class="bg-slate-50 dark:bg-slate-900/50 text-slate-500 dark:text-slate-400 border-b border-slate-200 dark:border-slate-700 text-xs uppercase font-semibold">
                      <th class="py-3.5 px-6">Pengguna</th>
                      <th class="py-3.5 px-6">Peran</th>
                      <th class="py-3.5 px-6">Status</th>
                      <th class="py-3.5 px-6 text-right">Aksi</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-200 dark:divide-slate-700">
                    {filteredUsers.length > 0 ? (
                      filteredUsers.map((user) => (
                        <tr key={user.id} class="hover:bg-slate-50/80 dark:hover:bg-slate-700/50 transition">
                          <td class="py-4 px-6 font-medium text-slate-800 dark:text-slate-100 flex items-center space-x-3">
                            <div class="w-8 h-8 rounded-full bg-brand-100 text-brand-700 dark:bg-slate-700 dark:text-brand-400 flex items-center justify-center font-bold text-xs uppercase">
                              {user.name.charAt(0)}
                            </div>
                            <span>{user.name}</span>
                          </td>
                          <td class="py-4 px-6 text-slate-600 dark:text-slate-300">{user.role}</td>
                          <td class="py-4 px-6">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300">
                              <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 mr-1.5"></span>
                              {user.status}
                            </span>
                          </td>
                          <td class="py-4 px-6 text-right">
                            <button 
                              onClick={() => handleDeleteUser(user.id)}
                              class="text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 p-1 transition">
                              <i class="fa-regular fa-trash-can"></i>
                            </button>
                          </td>
                        </tr>
                      ))
                    ) : (
                      <tr>
                        <td colSpan="4" class="py-8 text-center text-slate-400">
                          Tidak ada data pengguna ditemukan.
                        </td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* User Modal Component */}
          <UserModal 
            isOpen={isModalOpen} 
            onClose={() => setIsModalOpen(false)} 
            onAddUser={handleAddUser}
            addLog={addLog}
          />
        </div>
      );
    }

    // Render React Application to Root
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
