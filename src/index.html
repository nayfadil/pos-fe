<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Analytics - Frontend Agent</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & React DOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel standalone for JSX processing -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // SVG Icon Components
        const IconTrendingUp = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-emerald-400"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline><polyline points="16 7 22 7 22 13"></polyline></svg>
        );

        const IconUsers = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-indigo-400"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        );

        const IconDollar = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-amber-400"><line x1="12" y1="1" x2="12" y2="23"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
        );

        const IconActivity = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-sky-400"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>
        );

        const IconBell = () => (
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        );

        // Header Component
        const Navbar = () => {
            return (
                <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
                    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div class="flex items-center justify-between h-16">
                            <div class="flex items-center space-x-3">
                                <div class="w-9 h-9 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-xl flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">
                                    A
                                </div>
                                <span class="font-bold text-lg text-white tracking-tight">NexusUI</span>
                            </div>
                            <div class="flex items-center space-x-4">
                                <button class="p-2 text-slate-400 hover:text-white bg-slate-800/60 hover:bg-slate-800 rounded-lg transition-all relative">
                                    <IconBell />
                                    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-indigo-500 rounded-full animate-ping"></span>
                                    <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-indigo-500 rounded-full"></span>
                                </button>
                                <div class="flex items-center space-x-3 border-l border-slate-800 pl-4">
                                    <img class="w-9 h-9 rounded-full ring-2 ring-indigo-500/30" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar" />
                                    <div class="hidden sm:block text-left">
                                        <div class="text-sm font-medium text-slate-200">Sarah Connor</div>
                                        <div class="text-xs text-slate-400">Product Manager</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </header>
            );
        };

        // Stat Card Component
        const StatCard = ({ title, value, change, icon: Icon, isPositive }) => (
            <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-6 hover:border-slate-700 transition-all duration-300 hover:shadow-xl hover:shadow-indigo-500/5 group">
                <div class="flex items-center justify-between">
                    <span class="text-sm font-medium text-slate-400">{title}</span>
                    <div class="p-2.5 bg-slate-800/80 group-hover:bg-slate-800 rounded-xl border border-slate-700/50 transition-colors">
                        <Icon />
                    </div>
                </div>
                <div class="mt-4 flex items-baseline justify-between">
                    <h3 class="text-2xl font-bold text-white tracking-tight">{value}</h3>
                    <span class={`text-xs font-semibold px-2.5 py-1 rounded-full flex items-center gap-1 ${
                        isPositive ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border border-rose-500/20'
                    }`}>
                        {isPositive ? '+' : ''}{change}
                    </span>
                </div>
            </div>
        );

        // Main Dashboard Page
        const Dashboard = () => {
            const [filter, setFilter] = useState('7d');

            const transactions = [
                { id: 1, user: 'Alex Rivera', email: 'alex@example.com', amount: '+$250.00', status: 'Completed', date: '2 min yang lalu' },
                { id: 2, user: 'Sonia Gupta', email: 'sonia@example.com', amount: '+$1,200.00', status: 'Completed', date: '1 jam yang lalu' },
                { id: 3, user: 'Marco Rossi', email: 'marco@example.com', amount: '+$450.00', status: 'Pending', date: '3 jam yang lalu' },
                { id: 4, user: 'Evelyn Chen', email: 'evelyn@example.com', amount: '+$890.00', status: 'Completed', date: '5 jam yang lalu' },
            ];

            return (
                <div class="min-h-screen flex flex-col justify-between">
                    <div>
                        <Navbar />
                        
                        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
                            {/* Page Header */}
                            <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                                <div>
                                    <h1 class="text-2xl sm:text-3xl font-bold text-white tracking-tight">Ringkasan Performa</h1>
                                    <p class="text-slate-400 text-sm mt-1">Pantau analitik dan aktivitas transaksi terkini Anda.</p>
                                </div>
                                <div class="inline-flex p-1 bg-slate-900 border border-slate-800 rounded-xl">
                                    {['24h', '7d', '30d'].map((item) => (
                                        <button 
                                            key={item}
                                            onClick={() => setFilter(item)}
                                            class={`px-3.5 py-1.5 text-xs font-medium rounded-lg transition-all ${
                                                filter === item 
                                                    ? 'bg-indigo-600 text-white shadow-md' 
                                                    : 'text-slate-400 hover:text-white'
                                            }`}
                                        >
                                            {item.toUpperCase()}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Stats Grid */}
                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                                <StatCard title="Total Pendapatan" value="$45,231.89" change="20.1%" icon={IconDollar} isPositive={true} />
                                <StatCard title="Pengguna Aktif" value="+2,350" change="180.1%" icon={IconUsers} isPositive={true} />
                                <StatCard title="Penjualan" value="+12,234" change="19%" icon={IconTrendingUp} isPositive={true} />
                                <StatCard title="Tingkat Konversi" value="3.2%" change="-4.5%" icon={IconActivity} isPositive={false} />
                            </div>

                            {/* Content Section */}
                            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                {/* Activity Overview Graph Placeholder */}
                                <div class="lg:col-span-2 bg-slate-900/80 border border-slate-800/80 rounded-2xl p-6">
                                    <div class="flex items-center justify-between mb-6">
                                        <div>
                                            <h2 class="text-base font-semibold text-white">Grafik Pertumbuhan</h2>
                                            <p class="text-xs text-slate-400">Estimasi pendapatan mingguan</p>
                                        </div>
                                    </div>
                                    <div class="h-64 flex items-end justify-between gap-2 sm:gap-4 pt-8 px-2 border-b border-slate-800">
                                        {[40, 65, 45, 80, 55, 90, 70, 85, 60, 95, 75, 100].map((height, i) => (
                                            <div key={i} class="w-full bg-slate-800 rounded-t-md hover:bg-indigo-600/80 transition-all group relative flex flex-col justify-end" style={{ height: `${height}%` }}>
                                                <div class="opacity-0 group-hover:opacity-100 absolute -top-10 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-xs px-2 py-1 rounded text-white whitespace-nowrap transition-opacity pointer-events-none z-10">
                                                    ${height * 120}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                    <div class="flex justify-between text-xs text-slate-500 mt-4 px-1">
                                        <span>Jan</span><span>Feb</span><span>Mar</span><span>Apr</span><span>Mei</span><span>Jun</span>
                                        <span>Jul</span><span>Agu</span><span>Sep</span><span>Okt</span><span>Nov</span><span>Des</span>
                                    </div>
                                </div>

                                {/* Recent Transactions */}
                                <div class="bg-slate-900/80 border border-slate-800/80 rounded-2xl p-6">
                                    <div class="flex items-center justify-between mb-6">
                                        <h2 class="text-base font-semibold text-white">Transaksi Terakhir</h2>
                                        <button class="text-xs text-indigo-400 hover:text-indigo-300 font-medium">Lihat Semua</button>
                                    </div>
                                    <div class="space-y-4">
                                        {transactions.map((tx) => (
                                            <div key={tx.id} class="flex items-center justify-between p-3 rounded-xl hover:bg-slate-800/50 transition-colors border border-transparent hover:border-slate-800">
                                                <div class="flex items-center space-x-3">
                                                    <div class="w-8 h-8 rounded-full bg-slate-800 border border-slate-700 flex items-center justify-center font-semibold text-xs text-indigo-400">
                                                        {tx.user.charAt(0)}
                                                    </div>
                                                    <div>
                                                        <p class="text-sm font-medium text-slate-200">{tx.user}</p>
                                                        <p class="text-xs text-slate-500">{tx.date}</p>
                                                    </div>
                                                </div>
                                                <div class="text-right">
                                                    <p class="text-sm font-semibold text-emerald-400">{tx.amount}</p>
                                                    <span class="text-[10px] text-slate-400 bg-slate-800 px-2 py-0.5 rounded-full">{tx.status}</span>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </main>
                    </div>

                    {/* Footer */}
                    <footer class="border-t border-slate-800/60 bg-slate-950 py-6 mt-12">
                        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-slate-500">
                            &copy; {new Date().getFullYear()} NexusUI Dashboard Agent. Dibuat dengan React & Tailwind CSS.
                        </div>
                    </footer>
                </div>
            );
        };

        // Render to DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
